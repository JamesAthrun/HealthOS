x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-healthos}
      POSTGRES_USER: ${POSTGRES_MIGRATION_USER:-healthos_migrator}
      POSTGRES_PASSWORD: ${POSTGRES_MIGRATION_PASSWORD:?set POSTGRES_MIGRATION_PASSWORD in .env}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:-healthos_app}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?set POSTGRES_APP_PASSWORD in .env}
    command: >
      postgres
      -c shared_buffers=128MB
      -c max_connections=20
      -c work_mem=4MB
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init-app-role.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 384m
    logging: *logging
    restart: unless-stopped

  migrate:
    build: ./backend
    image: healthos-api:dev
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_MIGRATION_USER:-healthos_migrator}
      POSTGRES_PASSWORD: ${POSTGRES_MIGRATION_PASSWORD:?set POSTGRES_MIGRATION_PASSWORD in .env}
      POSTGRES_RUNTIME_ROLE: ${POSTGRES_APP_USER:-healthos_app}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  api:
    build: ./backend
    image: healthos-api:dev
    env_file: .env
    environment:
      # API 只使用无 BYPASSRLS、非表所有者的运行时角色。
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_APP_USER:-healthos_app}
      POSTGRES_PASSWORD: ${POSTGRES_APP_PASSWORD:?set POSTGRES_APP_PASSWORD in .env}
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - photos_data:/data/photos
    mem_limit: 512m
    logging: *logging
    restart: unless-stopped

  caddy:
    build:
      context: .
      dockerfile: infrastructure/Dockerfile
    image: healthos-web:dev
    ports:
      # 本地开发；Sprint 5 改为 80:80 和 443:443
      - "127.0.0.1:8080:80"
    volumes:
      - caddy_data:/data
    depends_on:
      - api
    mem_limit: 64m
    logging: *logging
    restart: unless-stopped

volumes:
  postgres_data:
  photos_data:
  caddy_data:
