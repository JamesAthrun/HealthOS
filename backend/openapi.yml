      summary: Get Today Dashboard
      operationId: get_today_dashboard_api_dashboard_today_get
      security:
      - SessionCookie: []
      parameters:
      - name: 'on'
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          description: 按账号时区计算的日期
          title: 'On'
        description: 按账号时区计算的日期
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
