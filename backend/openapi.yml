openapi: 3.1.0
info:
  title: HealthOS API
  description: HealthOS 家庭版后端 API。所有健康数据接口都使用 HttpOnly 会话 Cookie，并从认证主体派生所有者。
  version: 0.2.0
paths:
  /api/auth/login:
    post:
      tags:
      - account
      summary: Login
      operationId: login_api_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/auth/logout:
    post:
      tags:
      - account
      summary: Logout
      operationId: logout_api_auth_logout_post
      responses:
        '204':
          description: Successful Response
      security:
      - SessionCookie: []
  /api/me:
    get:
      tags:
      - account
      summary: Me
      operationId: me_api_me_get
