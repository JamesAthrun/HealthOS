          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Health Api Health Get
components:
  schemas:
    AccountSettingsIn:
      properties:
        display_name:
          type: string
          maxLength: 50
          minLength: 1
          title: Display Name
        timezone:
          type: string
          maxLength: 64
          minLength: 1
          title: Timezone
        locale:
          type: string
          maxLength: 16
          pattern: ^[a-z]{2}(?:-[A-Z]{2})?$
          title: Locale
      additionalProperties: false
      type: object
      required:
      - display_name
      - timezone
      - locale
      title: AccountSettingsIn
    AuditEventOut:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        event_type:
          type: string
          title: Event Type
        outcome:
          type: string
          title: Outcome
        ip_address:
          anyOf:
          - type: string
          - type: 'null'
          title: Ip Address
        created_at:
          type: string
          format: date-time
          title: Created At
      type: object
      required:
      - id
      - event_type
      - outcome
      - ip_address
      - created_at
      title: AuditEventOut
    ChangePasswordIn:
      properties:
        current_password:
          type: string
          maxLength: 128
          minLength: 1
          title: Current Password
        new_password:
          type: string
          maxLength: 128
          minLength: 8
          title: New Password
      type: object
      required:
      - current_password
      - new_password
      title: ChangePasswordIn
    ConsentOut:
      properties:
        granted:
          type: boolean
          title: Granted
        granted_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Granted At
      type: object
      required:
      - granted
      - granted_at
      title: ConsentOut
    DailySummary:
      properties:
        date:
          type: string
          format: date
          title: Date
        kcal:
          type: number
          title: Kcal
        protein_g:
          type: number
          title: Protein G
        carbs_g:
          type: number
          title: Carbs G
        fat_g:
          type: number
          title: Fat G
        meal_count:
          type: integer
          title: Meal Count
        exercise_minutes:
          type: integer
          title: Exercise Minutes
        steps:
          type: integer
          title: Steps
        sleep_minutes:
          type: integer
          title: Sleep Minutes
        sleep_quality:
          anyOf:
          - type: number
          - type: 'null'
          title: Sleep Quality
      type: object
      required:
      - date
      - kcal
      - protein_g
      - carbs_g
      - fat_g
      - meal_count
      - exercise_minutes
      - steps
      - sleep_minutes
      - sleep_quality
      title: DailySummary
    ExerciseIn:
      properties:
        type:
          type: string
          maxLength: 50
          minLength: 1
          title: Type
        started_at:
          type: string
          format: date-time
          title: Started At
        minutes:
          type: integer
          maximum: 1440.0
          minimum: 1.0
          title: Minutes
        intensity:
          type: string
          enum:
          - low
          - moderate
          - high
          title: Intensity
        steps:
          anyOf:
          - type: integer
            maximum: 200000.0
            minimum: 0.0
          - type: 'null'
          title: Steps
        notes:
          anyOf:
          - type: string
            maxLength: 2000
          - type: 'null'
          title: Notes
      additionalProperties: false
      type: object
      required:
      - type
      - started_at
      - minutes
      - intensity
      title: ExerciseIn
    ExerciseOut:
      properties:
        type:
          type: string
          maxLength: 50
          minLength: 1
          title: Type
        started_at:
          type: string
          format: date-time
          title: Started At
        minutes:
          type: integer
          maximum: 1440.0
          minimum: 1.0
          title: Minutes
        intensity:
          type: string
          enum:
          - low
          - moderate
          - high
          title: Intensity
        steps:
          anyOf:
          - type: integer
            maximum: 200000.0
            minimum: 0.0
          - type: 'null'
          title: Steps
        notes:
          anyOf:
          - type: string
            maxLength: 2000
          - type: 'null'
          title: Notes
        id:
          type: string
          format: uuid
          title: Id
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
